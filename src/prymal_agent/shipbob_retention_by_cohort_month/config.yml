table:
  name: "shipbob_retention_by_cohort"
  description: "30/60/90 day retention metrics by cohort month, extracted from ShipBob (the 3PL and order management solution used by Prymal). Partitioned by report_date (the date the report was generated). IMPORTANT: take the latest report_date to get the most recent data"
  partition_column: "report_date"

columns:
  - name: "cohort_month"
    type: "date"
    comment: "First day of the month in which the customers in this cohort placed their first order"
  - name: "total_customers"
    type: "bigint"
    comment: "Number of distinct customers whose first order fell in cohort_month"
  - name: "retained_30d_count"
    type: "bigint"
    comment: "Customers in the cohort who placed another order within 1 to 30 days of their first order"
  - name: "retained_30d_pct"
    type: "double"
    comment: "retained_30d_count as a percentage of total_customers (0 to 100)"
  - name: "retained_60d_count"
    type: "bigint"
    comment: "Customers in the cohort who placed another order within 1 to 60 days of their first order"
  - name: "retained_60d_pct"
    type: "double"
    comment: "retained_60d_count as a percentage of total_customers (0 to 100)"
  - name: "retained_90d_count"
    type: "bigint"
    comment: "Customers in the cohort who placed another order within 1 to 90 days of their first order"
  - name: "retained_90d_pct"
    type: "double"
    comment: "retained_90d_count as a percentage of total_customers (0 to 100)"
