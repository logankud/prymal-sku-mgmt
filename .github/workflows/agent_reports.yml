name: Prymal Agent Report Automation

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'  # Runs at AM every day


jobs:
  prymal_agent_reports:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo code
        uses: actions/checkout@v3
      - run: echo "${{ github.repository }} repository has been cloned to the runner"
      - name: List files in the repository
        run: |
          ls ${{ github.workspace }}
      - name: Print wd
        run: |
          pwd
      - name: Set up Python environment
        uses: actions/setup-python@v2
        with:
          python-version: '3.10.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Each partitioned table gets its own gap check over the last 7 days.
      # Retention is a full recompute "as of" the run date, so it is not
      # backfilled; relabelling today's answer with an old date would mislead.
      - name: Auto-backfill missing dates for partitioned prymal_agent tables
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_ACCESS_SECRET: ${{ secrets.AWS_ACCESS_SECRET }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          GLUE_DATABASE_NAME: ${{ secrets.GLUE_DATABASE_NAME }}
          GLUE_DATABASE_NAME_AGENT: ${{ secrets.GLUE_DATABASE_NAME_AGENT }}
        run: |
          src/prymal_agent/backfill.sh src/prymal_agent/shipbob_daily_order_cnt_by_channel shipbob_daily_order_cnt_by_channel order_date 7
          src/prymal_agent/backfill.sh src/prymal_agent/shipbob_current_inventory shipbob_current_inventory partition_date 7

      # The sub-jobs below are independent, so a failure in one must not
      # skip the others. The job still reports failure if any step fails.
      - name: Run job - shipbob_retention_by_cohort_month
        if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_ACCESS_SECRET: ${{ secrets.AWS_ACCESS_SECRET }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          GLUE_DATABASE_NAME: ${{ secrets.GLUE_DATABASE_NAME }}
          GLUE_DATABASE_NAME_AGENT: ${{ secrets.GLUE_DATABASE_NAME_AGENT }}
        run: python3 src/prymal_agent/main.py --job_dir src/prymal_agent/shipbob_retention_by_cohort_month

      - name: Run job - shipbob_daily_order_cnt_by_channel
        if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_ACCESS_SECRET: ${{ secrets.AWS_ACCESS_SECRET }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          GLUE_DATABASE_NAME: ${{ secrets.GLUE_DATABASE_NAME }}
          GLUE_DATABASE_NAME_AGENT: ${{ secrets.GLUE_DATABASE_NAME_AGENT }}
        run: python3 src/prymal_agent/main.py --job_dir src/prymal_agent/shipbob_daily_order_cnt_by_channel

      - name: Run job - shipbob_orders_obfuscated
        if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_ACCESS_SECRET: ${{ secrets.AWS_ACCESS_SECRET }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          GLUE_DATABASE_NAME: ${{ secrets.GLUE_DATABASE_NAME }}
          GLUE_DATABASE_NAME_AGENT: ${{ secrets.GLUE_DATABASE_NAME_AGENT }}
        working-directory: src/prymal_agent/shipbob_orders_obfuscated
        run: python main.py

      - name: Run job - shipbob_current_inventory
        if: ${{ !cancelled() }}
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_ACCESS_SECRET: ${{ secrets.AWS_ACCESS_SECRET }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
          GLUE_DATABASE_NAME: ${{ secrets.GLUE_DATABASE_NAME }}
          GLUE_DATABASE_NAME_AGENT: ${{ secrets.GLUE_DATABASE_NAME_AGENT }}
        run: python3 src/prymal_agent/main.py --job_dir src/prymal_agent/shipbob_current_inventory

      - run: echo "Job status - ${{ job.status }}."
